<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Ẩm Thực Việt Nam</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            color: #b71c1c;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #image {
            width: 700px;
            height: 400px;
            border: 4px solid #b71c1c;
            border-radius: 12px;
            margin: 0 auto 30px auto;
            background-color: #333;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: #ffffff;
            text-align: center;
            font-size: 120%;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            box-sizing: border-box;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: background-image 0.3s ease-in-out;
            position: relative;
        }

        #image::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 8px;
            z-index: 1;
        }

        #image span {
            position: relative;
            z-index: 2;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .preview {
            width: 140px;
            height: 100px;
            border: 3px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            object-fit: cover;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            transition: transform 0.2s, border-color 0.2s;
        }

        .preview:hover {
            transform: translateY(-5px);
            border-color: #b71c1c;
        }
    </style>
</head>
<body>

    <h1>Ẩm Thực Truyền Thống Việt Nam</h1>

    <div id="image">
        <span id="text-content">Rê chuột qua hình ảnh món ăn bên dưới để xem chi tiết</span>
    </div>

    <div class="gallery">
        <img class="preview" 
             alt="Phở Bò - Món ăn quốc hồn quốc túy với nước dùng đậm đà ninh từ xương" 
             src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=800" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Bánh Mì - Sự kết hợp hoàn hảo giữa vỏ giòn và nhân thịt, pate, rau thơm" 
             src="https://media-cdn-v2.laodong.vn/storage/newsportal/2024/6/7/1350134/Banh-Mi-6.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Gỏi Cuốn - Món ăn thanh mát gồm tôm, thịt, bún và rau sống cuốn bánh tráng" 
             src="https://cooponline.vn/tin-tuc/wp-content/uploads/2025/10/goi-cuon-tom-thit-chuan-vi-nuoc-cham-dau-phong-1.png" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">

        <img class="preview" 
             alt="Bún Chả - Thịt nướng thơm lừng ăn kèm bún, rau sống và nước mắm chua ngọt" 
             src="https://static.vinwonders.com/production/bun-cha-cau-giay-1.jpg" 
             onmouseover="upDate(this)" 
             onmouseleave="unDo()">
    </div>

    <script>
        function upDate(previewPic) {
            console.log("Event triggered");
            console.log("Alt:", previewPic.alt);
            console.log("Src:", previewPic.src);

            let imageDiv = document.getElementById("image");
            let textSpan = document.getElementById("text-content");

            textSpan.innerHTML = previewPic.alt;
            imageDiv.style.backgroundImage = "url('" + previewPic.src + "')";
        }

        function unDo() {
            let imageDiv = document.getElementById("image");
            let textSpan = document.getElementById("text-content");

            imageDiv.style.backgroundImage = "url('')";
            textSpan.innerHTML = "Rê chuột qua hình ảnh món ăn bên dưới để xem chi tiết";
        }
    </script>

</body>
</html>
